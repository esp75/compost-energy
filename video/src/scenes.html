<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How Compostito works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root { --night:#050505; --ink:#fafafa; --mist:#a1a1aa; --dim:#71717a; --line:#27272a; --yellow:#f7c72f; --teal:#2dd4bf; --violet:#8b5cf6; }
  html, body { margin:0; background:var(--night); }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--night); font-family:"Inter Tight", "Helvetica Neue", Arial, sans-serif; }
  #scene { position:absolute; inset:0; }
  #cap { position:absolute; left:50%; bottom:54px; transform:translateX(-50%); max-width:1480px; padding:18px 34px 20px; border-radius:18px;
         background:rgba(13,13,15,.86); border:1px solid #27272a; color:var(--ink); font-size:36px; line-height:1.32; font-weight:500; text-align:center; letter-spacing:-.005em; }
  #cap b { color:var(--yellow); font-weight:600; }
  #cap:empty { display:none; }
</style>
</head>
<body>
<script src="sim-data.js"></script>
<div id="stage"><svg id="scene" viewBox="0 0 1920 1080" width="1920" height="1080"></svg><div id="cap"></div></div>
<script>
// Pure function of time: renderFrame(t) draws the frame at t seconds.
// No CSS animations or timers, so every frame is reproducible.
const DATA = window.SIM_DATA || {day:[0,45],T:[15,15],amb:[13,13],phases:[0,3.3,13.2,23,45],turns:[9.5,23]};
const C = { bg:"#050505", panel:"#0d0d0f", line:"#27272a", line2:"#3f3f46", ink:"#fafafa", mist:"#a1a1aa", dim:"#71717a",
  yellow:"#f7c72f", teal:"#2dd4bf", violet:"#8b5cf6", hot:"#f97316", red:"#ef4444", green:"#84cc16", brown:"#8b5a2b", soil:"#3b2a1c",
  A:"#f7c72f", B:"#f97316", Cc:"#38bdf8", D:"#84cc16" };
const SERIF = "'Instrument Serif', Georgia, serif", SANS = "'Inter Tight', 'Helvetica Neue', Arial, sans-serif";

// ---- helpers --------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const ramp = (t, a, d = .6) => ease((t - a) / d);               // 0 -> 1 starting at a
const win = (t, a, b, d = .5) => Math.min(ramp(t, a, d), 1 - ramp(t, b - d, d));  // in at a, out by b
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const f1 = x => x.toFixed(1);
function T(x, y, s, o = {}) {
  const a = Object.assign({ size: 28, fill: C.ink, anchor: "start", weight: 400, font: SANS, op: 1, ls: 0 }, o);
  return `<text x="${f1(x)}" y="${f1(y)}" font-family="${a.font}" font-size="${a.size}" fill="${a.fill}" text-anchor="${a.anchor}" font-weight="${a.weight}" opacity="${a.op}" letter-spacing="${a.ls}"${a.extra || ""}>${s}</text>`;
}
const G = (op, inner, tr = "") => op <= 0.001 ? "" : `<g opacity="${op.toFixed(3)}"${tr ? ` transform="${tr}"` : ""}>${inner}</g>`;
const R = (x, y, w, h, o = {}) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(Math.max(w, 0))}" height="${f1(Math.max(h, 0))}" rx="${o.rx || 0}" fill="${o.fill || "none"}" stroke="${o.stroke || "none"}" stroke-width="${o.sw || 1}" opacity="${o.op ?? 1}"${o.extra || ""}/>`;
const Cir = (x, y, r, o = {}) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(Math.max(r, 0))}" fill="${o.fill || "none"}" stroke="${o.stroke || "none"}" stroke-width="${o.sw || 1}" opacity="${o.op ?? 1}"/>`;
const L = (x1, y1, x2, y2, o = {}) => `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${o.stroke || C.ink}" stroke-width="${o.sw || 2}" stroke-linecap="round" opacity="${o.op ?? 1}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ""}${o.extra || ""}/>`;
const P = (d, o = {}) => `<path d="${d}" fill="${o.fill || "none"}" stroke="${o.stroke || "none"}" stroke-width="${o.sw || 2}" stroke-linecap="round" stroke-linejoin="round" opacity="${o.op ?? 1}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ""}${o.extra || ""}/>`;
function arrow(x1, y1, x2, y2, col, sw = 3, op = 1) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 7 + sw * 2;
  return L(x1, y1, x2 - Math.cos(a) * h * .6, y2 - Math.sin(a) * h * .6, { stroke: col, sw, op }) +
    `<polygon points="${f1(x2)},${f1(y2)} ${f1(x2 - h * Math.cos(a - .45))},${f1(y2 - h * Math.sin(a - .45))} ${f1(x2 - h * Math.cos(a + .45))},${f1(y2 - h * Math.sin(a + .45))}" fill="${col}" opacity="${op}"/>`;
}
function tag(x, y, s, col = C.mist) {
  const w = s.length * 9.6 + 26;
  return R(x, y - 22, w, 32, { rx: 16, stroke: col, sw: 1.4 }) + T(x + 13, y - 1, s, { size: 15, fill: col, weight: 600, ls: 1.4 });
}
// microbe: capsule (bacterium) at x,y with angle
const bact = (x, y, ang, col = C.violet, s = 1, op = 1) =>
  `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(ang)}) scale(${s})" opacity="${op}"><rect x="-13" y="-5.5" width="26" height="11" rx="5.5" fill="${col}" opacity=".9"/><circle cx="6" cy="0" r="2" fill="#fff" opacity=".45"/></g>`;
// thermometer
function thermo(x, y, h, val, col, label = true) {
  const k = clamp((val - 0) / 80), bulb = 22;
  let s = R(x - 12, y, 24, h, { rx: 12, fill: C.panel, stroke: C.line2, sw: 2 }) + Cir(x, y + h + 14, bulb, { fill: col, stroke: C.line2, sw: 2 });
  s += R(x - 6, y + h - h * k, 12, h * k + 10, { rx: 6, fill: col });
  for (const v of [20, 40, 60]) { const yy = y + h - h * v / 80; s += L(x + 14, yy, x + 24, yy, { stroke: C.dim, sw: 1.5 }) + T(x + 30, yy + 6, `${v}°`, { size: 17, fill: C.dim }); }
  if (label) s += T(x, y - 18, `${Math.round(val)} °C`, { size: 40, anchor: "middle", font: SERIF, fill: C.ink });
  return s;
}
function mound(cx, base, w, h) { return `M${cx - w / 2},${base} C${cx - w / 2.6},${base - h * .9} ${cx - w / 6},${base - h} ${cx},${base - h} C${cx + w / 6},${base - h} ${cx + w / 2.6},${base - h * .9} ${cx + w / 2},${base} Z`; }
function wasteItem(kind, x, y, rot, s = 1) {
  const tr = `translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${s})`;
  if (kind === 0) return `<g transform="${tr}"><path d="M-22,0 C-10,-14 10,-14 22,0 C10,14 -10,14 -22,0Z" fill="${C.green}"/><line x1="-20" y1="0" x2="20" y2="0" stroke="#3f6212" stroke-width="2"/></g>`;
  if (kind === 1) return `<g transform="${tr}"><circle r="13" fill="${C.red}"/><rect x="-1.5" y="-21" width="3" height="9" fill="${C.brown}"/></g>`;
  if (kind === 2) return `<g transform="${tr}"><rect x="-20" y="-9" width="40" height="18" rx="7" fill="#d6a35c"/></g>`;
  if (kind === 3) return `<g transform="${tr}"><path d="M-14,-12 L14,-12 L10,12 L-10,12Z" fill="#c8a27a"/></g>`;
  return `<g transform="${tr}"><line x1="-24" y1="0" x2="24" y2="0" stroke="${C.brown}" stroke-width="5" stroke-linecap="round"/><line x1="4" y1="0" x2="14" y2="-9" stroke="${C.brown}" stroke-width="3"/></g>`;
}
function tempAt(day) {
  const d = DATA.day, i = Math.max(1, Math.min(d.length - 1, d.findIndex(v => v >= day)));
  const k = clamp((day - d[i - 1]) / (d[i] - d[i - 1] || 1));
  return lerp(DATA.T[i - 1], DATA.T[i], k);
}
// sample points along a polyline (array of [x,y]) at fraction u
function along(pts, u) {
  let tot = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); tot += l; }
  let d = clamp(u) * tot;
  for (let i = 0; i < seg.length; i++) { if (d <= seg[i]) { const k = d / seg[i]; return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]; } d -= seg[i]; }
  return pts[pts.length - 1];
}
const mix = (c1, c2, k) => { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16); const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, clamp(k))); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };

// ---- chapters ---------------------------------------------------------------
// caps: caption lines for the chapter; they are spread over the chapter after
// its title card, in proportion to their length.
const CH = [];
function chapter(o) { CH.push(o); }

chapter({ id: "intro", dur: 5.5, caps: [], draw(t) {
  const r = rng(3); let s = "";
  for (let i = 0; i < 26; i++) { const x = 960 + (r() - .5) * 900, ph = r() * 6, sp = 40 + r() * 50; const y = 760 - ((t * sp + ph * 100) % 520);
    s += Cir(x, y, 3 + r() * 5, { fill: i % 3 ? C.yellow : C.hot, op: .18 * clamp((760 - y) / 160) * clamp(y / 300) }); }
  s += G(ramp(t, .2, 1), T(960, 470, "How Compostito works", { size: 132, anchor: "middle", font: SERIF }));
  s += G(ramp(t, 1.1, 1), T(960, 560, "Food waste in. Heat and fertiliser out.", { size: 40, anchor: "middle", fill: C.mist }));
  s += G(ramp(t, 2, 1), T(960, 660, "COMPOST ENERGY · OPEN HARDWARE", { size: 18, anchor: "middle", fill: C.yellow, weight: 600, ls: 5 }));
  return s;
}});

chapter({ id: "c1", num: "01", title: "What compost is", dur: 21, caps: [
  "Compost is what happens when microbes eat our food and garden waste.",
  "Bacteria and fungi break down carbon-rich <b>browns</b> and nitrogen-rich <b>greens</b>, ideally mixed about <b>25–30 : 1</b>.",
  "With oxygen, they turn it into CO₂, water, <b>heat</b> and <b>humus</b>, the dark, stable part of good soil."],
  draw(t) {
    let s = ""; const r = rng(11); const cx = 420, base = 760, N = 22;
    let landed = 0; const items = [];
    for (let i = 0; i < N; i++) {
      const t0 = 2.4 + i * .22, k = clamp((t - t0) / .75);
      const rx = cx + (r() - .5) * 330, ry = base - 30 - r() * 120 * (1 - Math.abs(rx - cx) / 220), kind = Math.floor(r() * 5), rot = r() * 360;
      if (k <= 0) continue; if (k >= 1) landed++;
      items.push(wasteItem(kind, rx, lerp(120, ry, k * k), rot + k * 90, 1.25));
    }
    const h = 40 + 150 * clamp(landed / N);
    s += P(mound(cx, base, 520, h), { fill: C.soil, op: ramp(t, 2.4, 1) });
    s += L(110, base, 740, base, { stroke: C.line2, sw: 2 });
    s += items.join("");
    // magnifier
    const mo = ramp(t, 7.5, .9), mx = 1010, my = 450, mr = 235;
    if (mo > 0) {
      let m = `<clipPath id="mag"><circle cx="${mx}" cy="${my}" r="${mr}"/></clipPath>`;
      m += L(cx + 90, base - 120, mx - mr * .8, my + mr * .55, { stroke: C.line2, sw: 2 });
      m += Cir(mx, my, mr, { fill: "#0b0806" });
      let inner = "";
      const rr = rng(5), eat = clamp((t - 9) / 11);
      for (let i = 0; i < 16; i++) { const x = mx + (rr() - .5) * 380, y = my + (rr() - .5) * 380, rad = (14 + rr() * 26) * (1 - .65 * eat * rr());
        inner += `<path d="M${f1(x - rad)},${f1(y)} Q${f1(x - rad * .4)},${f1(y - rad * 1.1)} ${f1(x + rad)},${f1(y - rad * .2)} Q${f1(x + rad * .5)},${f1(y + rad)} ${f1(x - rad)},${f1(y)}Z" fill="${i % 2 ? "#6b4a2a" : "#4d7c0f"}" opacity=".85"/>`; }
      // fungal hyphae growing
      const grow = clamp((t - 9) / 9);
      for (let j = 0; j < 4; j++) { const a0 = j * 1.6 + .3; let x = mx + Math.cos(a0) * 150, y = my + Math.sin(a0) * 150; let d = `M${f1(x)},${f1(y)}`;
        for (let k = 0; k < 14 * grow; k++) { x += Math.cos(a0 + Math.PI + Math.sin(k * 1.3 + j) * .9) * 16; y += Math.sin(a0 + Math.PI + Math.sin(k * 1.3 + j) * .9) * 16; d += ` L${f1(x)},${f1(y)}`; }
        inner += P(d, { stroke: C.teal, sw: 2.5, op: .85 }); }
      const nb = Math.round(8 + 40 * clamp((t - 8.5) / 10));
      for (let i = 0; i < nb; i++) { const ph = rr() * 6.28, rad = 40 + rr() * 170, sp = .25 + rr() * .4;
        inner += bact(mx + Math.cos(ph + t * sp) * rad, my + Math.sin(ph * 1.3 + t * sp) * rad * .9, (ph + t * sp) * 57 + 90, C.violet, 1.1); }
      m += `<g clip-path="url(#mag)">${inner}</g>` + Cir(mx, my, mr, { stroke: C.ink, sw: 3 });
      m += G(ramp(t, 10, .6), T(mx + mr + 24, my - 60, "bacteria", { size: 26, fill: C.violet, weight: 600 }) + T(mx + mr + 24, my - 24, "fungi", { size: 26, fill: C.teal, weight: 600 }));
      s += G(mo, m);
    }
    // C:N card
    const co = ramp(t, 10.5, .8);
    if (co > 0) {
      let c = R(1390, 210, 420, 230, { rx: 18, fill: C.panel, stroke: C.line, sw: 1.5 });
      c += T(1418, 256, "THE MIX", { size: 16, fill: C.mist, weight: 600, ls: 3 });
      c += R(1418, 280, 300, 34, { rx: 6, fill: "#c8a27a" }) + T(1730, 306, "C", { size: 26, weight: 700 });
      c += R(1418, 326, 300 / 27 * 1.6, 34, { rx: 6, fill: C.green }) + T(1440, 352, "N", { size: 26, weight: 700 });
      c += T(1418, 410, "C : N ≈ 25–30 : 1", { size: 40, font: SERIF });
      s += G(co, c);
    }
    // equation
    const toks = [["organic matter", C.ink], ["+", C.dim], ["O₂", C.teal], ["→", C.dim], ["CO₂", C.mist], ["+", C.dim], ["H₂O", C.mist], ["+", C.dim], ["heat", C.yellow], ["+", C.dim], ["humus", "#c08a55"]];
    let x = 1060 - 0, eq = ""; const widths = toks.map(([w]) => w.length * 21 + 26); let total = widths.reduce((a, b) => a + b, 0); x = 1150 - total / 2;
    toks.forEach(([w, col], i) => { const o = ramp(t, 15.2 + i * .28, .4); eq += T(x, 830, w, { size: 44, fill: col, font: SERIF, op: o }); x += widths[i]; });
    s += eq;
    return s;
  }});

chapter({ id: "c2", num: "02", title: "Aerobic vs anaerobic", dur: 21, caps: [
  "Microbes can work <b>with</b> oxygen (aerobic) or <b>without</b> it (anaerobic). The difference matters.",
  "Aerobic: fast, hot (55–70 °C) and almost odourless. Carbon leaves as CO₂ and most nitrogen stays in the compost.",
  "Anaerobic: slow and cool. A wet, airless pile gives off methane, about <b>28×</b> as warming as CO₂, and loses nitrogen as ammonia."],
  draw(t) {
    let s = "";
    const panel = (x0, good) => {
      const o = ramp(t, good ? 2.4 : 3.2, .8); if (o <= 0) return "";
      const r = rng(good ? 21 : 22); let p = R(x0, 180, 800, 620, { rx: 22, fill: C.panel, stroke: C.line, sw: 1.5 });
      p += T(x0 + 36, 240, good ? "Aerobic" : "Anaerobic", { size: 56, font: SERIF });
      p += T(x0 + 36, 278, good ? "with oxygen" : "without oxygen", { size: 24, fill: good ? C.teal : C.violet, weight: 600 });
      const cx = x0 + 300, base = 640;
      if (good) {
        p += P(mound(cx, base, 400, 230), { fill: C.soil });
        for (let i = 0; i < 18; i++) p += Cir(cx + (r() - .5) * 280, base - 20 - r() * 170 * .8, 6 + r() * 6, { fill: "#0d0d0f", op: .9 });
        const k = (t * .55) % 1;
        for (let i = 0; i < 3; i++) { const kk = (k + i / 3) % 1; p += arrow(cx - 300 + 90 * kk, base - 40 - i * 40, cx - 220 + 90 * kk, base - 60 - i * 40, C.teal, 3, win(kk, 0, 1, .2)); }
        p += T(cx - 290, base - 170, "O₂", { size: 30, fill: C.teal, weight: 700 });
        for (let i = 0; i < 7; i++) { const ph = r(), y = base - 240 - ((t * 60 + ph * 200) % 200), xx = cx - 120 + i * 40;
          p += P(`M${xx},${y + 40} q10,-12 0,-24 q-10,-12 0,-24`, { stroke: i % 2 ? C.yellow : C.mist, sw: 3, op: .7 * clamp((y - (base - 460)) / 80) }); }
        p += T(cx + 120, base - 320, "CO₂ + water vapour", { size: 22, fill: C.mist });
        p += thermo(x0 + 690, 330, 260, lerp(15, 65, ramp(t, 9, 3)), C.hot);
      } else {
        p += R(cx - 220, base - 90, 440, 90, { rx: 8, fill: "#241a12" }) + R(cx - 220, base - 26, 440, 26, { rx: 4, fill: "#1e3a5f", op: .9 });
        for (let i = 0; i < 9; i++) { const ph = r(), y = base - 100 - ((t * 45 + ph * 220) % 260), xx = cx - 180 + r() * 360;
          p += Cir(xx, y, 9, { stroke: C.violet, sw: 2.5, op: .8 * clamp((y - (base - 380)) / 60) }); }
        p += T(cx - 60, base - 300, "CH₄", { size: 32, fill: C.violet, weight: 700 }) + T(cx + 60, base - 260, "NH₃ · H₂S", { size: 24, fill: C.dim, weight: 600 });
        p += thermo(x0 + 690, 330, 260, lerp(15, 30, ramp(t, 12, 3)), C.violet);
      }
      const lines = good ? [["✓", "Hot enough to kill pathogens"], ["✓", "Almost no smell"], ["✓", "Keeps most nitrogen"]] :
        [["✕", "Methane, ~28× CO₂ (IPCC AR5)"], ["✕", "Rotten-egg smell"], ["✕", "Nitrogen lost as ammonia"]];
      lines.forEach(([m, w], i) => { const oo = ramp(t, (good ? 9.5 : 14) + i * .5, .5);
        p += G(oo, T(x0 + 40, 700 + i * 34, m, { size: 24, fill: good ? C.teal : C.red, weight: 700 }) + T(x0 + 74, 700 + i * 34, w, { size: 24, fill: C.ink })); });
      return G(o, p);
    };
    s += panel(120, true) + panel(1000, false);
    return s;
  }});

// Compostito section geometry (shared by chapters 3, 4 and 6)
const BOX = { x: 560, w: 440, top: 230 }; BOX.A = [250, 400]; BOX.B = [410, 560]; BOX.Cc = [570, 650]; BOX.D = [660, 740]; BOX.bottom = 756;
function compostito(t, o = {}) {
  const x0 = BOX.x, w = BOX.w, ins = 16, show = o.show || (() => 1);
  let s = "";
  // stilts and ground
  s += G(show("frame"), R(x0 + 10, BOX.bottom, 22, 120, { fill: "#6b4a2a" }) + R(x0 + w - 32, BOX.bottom, 22, 120, { fill: "#6b4a2a" }) + L(x0 - 120, 876, x0 + w + 120, 876, { stroke: C.line2, sw: 2 }));
  s += G(show("frame"), R(x0, BOX.top, w, BOX.bottom - BOX.top, { rx: 6, fill: "#140f0b", stroke: "#a0703f", sw: 4 }));
  // roof tank + hatch
  s += G(show("tank"), R(x0 + 30, BOX.top - 90, 170, 90, { rx: 10, fill: C.panel, stroke: C.line2, sw: 2 }) + T(x0 + 115, BOX.top - 38, "rainwater", { size: 18, fill: C.mist, anchor: "middle" }));
  s += G(show("frame"), R(x0 + 250, BOX.top - 10, 150, 14, { rx: 4, fill: "#a0703f" }));
  const ch = [["A", BOX.A, C.A], ["B", BOX.B, C.B], ["C", BOX.Cc, C.Cc], ["D", BOX.D, C.D]];
  ch.forEach(([n, [y0, y1], col]) => {
    const op = show("ch" + n); if (op <= 0) return;
    const ww = n === "C" || n === "D" ? (w - 2 * ins) : (w - 2 * ins);
    let c = R(x0 + ins, y0, ww, y1 - y0, { rx: 4, fill: col, op: .22 }) + R(x0 + ins, y0, ww, y1 - y0, { rx: 4, stroke: col, sw: 2, op: .9, extra: ` stroke-dasharray="6 5"` });
    c += T(x0 + 40, y0 + 46, n, { size: 44, font: SERIF, fill: col });
    s += G(op, c);
  });
  return s;
}
const chLabel = (n, y, title, sub, col, op) => G(op, Cir(1080, y - 9, 9, { fill: col }) + T(1104, y, `<tspan font-weight="600">${n}  ${title}</tspan>`, { size: 30 }) + T(1104, y + 34, sub, { size: 22, fill: C.mist }));

chapter({ id: "c3", num: "03", title: "Meet Compostito", dur: 23, caps: [
  "Meet <b>Compostito</b>: a home composter that runs each phase in its own chamber, stacked on stilts.",
  "Waste goes in at the top. Mesh walls and two vents let air rise through the pile: cool air in low, warm air out high.",
  "Every week or so, material moves down a chamber: A → B → C → D. C and D are half size, because the pile shrinks by 20–50 %."],
  draw(t) {
    const show = k => ({ frame: ramp(t, 2.2, .8), tank: ramp(t, 8.6, .6), chA: ramp(t, 3.2, .5), chB: ramp(t, 3.7, .5), chC: ramp(t, 4.2, .5), chD: ramp(t, 4.7, .5) })[k] ?? 1;
    let s = compostito(t, { show });

    // waste dropping through the hatch

    for (let i = 0; i < 6; i++) { const t0 = 8.2 + i * .35, k = clamp((t - t0) / .8); if (k <= 0) continue;
      const x = BOX.x + 290 + r() * 70; const y = lerp(90, 300 + r() * 60, k * k);
      s += G(1 - ramp(t, 15, .6), wasteItem(i % 5, x, y, r() * 360 + k * 120, 1)); }
    s += G(win(t, 8, 12.5), arrow(BOX.x + 325, 110, BOX.x + 325, 200, C.ink, 3) + T(BOX.x + 360, 150, "food & garden waste", { size: 22, fill: C.mist }));
    // drip line
    s += G(ramp(t, 9, .6), P(`M${BOX.x + 115},${BOX.top} L${BOX.x + 115},${BOX.B[0] + 30} L${BOX.x + 200},${BOX.B[0] + 30}`, { stroke: C.teal, sw: 3, dash: "7 6", extra: ` stroke-dashoffset="${f1(-t * 30)}"` }));
    // airflow

      let a = arrow(BOX.x - 170, BOX.D[1] - 20, BOX.x - 6, BOX.D[1] - 20, C.teal, 4) + T(BOX.x - 170, BOX.D[1] - 40, "VB: cool air in", { size: 22, fill: C.teal, weight: 600 });
      a += arrow(BOX.x + BOX.w + 6, BOX.A[0] + 20, BOX.x + BOX.w + 150, BOX.A[0] - 30, C.hot, 4) + "";
      a += T(BOX.x + BOX.w + 160, BOX.A[0] - 34, "VH: warm, moist air out", { size: 22, fill: C.hot, weight: 600 });
      const rr = rng(7);
      for (let i = 0; i < 26; i++) { const ph = rr(), u = (t * .12 + ph) % 1; const x = BOX.x + 60 + rr() * (BOX.w - 120) + Math.sin(u * 12 + i) * 12; const y = lerp(BOX.D[1] - 10, BOX.A[0] + 10, u);

      s += G(ao * (1 - ramp(t, 15.4, .5) * .6), a);

    const mo = ramp(t, 15.5, .6);
    if (mo > 0) {
      const stops = [BOX.A, BOX.B, BOX.Cc, BOX.D], weeks = ["week 0", "week 1", "week 5", "week 8+"];
      const u = clamp((t - 16) / 6) * 3, i = Math.min(2, Math.floor(u)), k = ease(u - i);
      const y0 = lerp(stops[i][0], stops[i + 1][0], k), y1 = lerp(stops[i][1], stops[i + 1][1], k);
      s += G(mo, R(BOX.x + 20, y0 + 4, BOX.w - 40, y1 - y0 - 8, { rx: 6, stroke: C.ink, sw: 4 }));
      const wi = Math.min(3, Math.round(u));
      s += G(mo, T(BOX.x + BOX.w - 30, (y0 + y1) / 2 + 12, weeks[wi], { size: 30, anchor: "end", weight: 600 }));
    }
    return s;
  }});

// ---- timeline -------------------------------------------------------------
let acc = 0; for (const c of CH) { c.start = acc; acc += c.dur; }
const DURATION = acc;
const TITLE_CARD = 2.2;
const CAPTIONS = [];
for (const c of CH) {
  if (!c.caps.length) continue;
  const a = c.start + TITLE_CARD, b = c.start + c.dur - .3, w = c.caps.map(s => s.replace(/<[^>]+>/g, "").length), tot = w.reduce((x, y) => x + y, 0);
  let x = a; c.caps.forEach((s, i) => { const d = (b - a) * w[i] / tot; CAPTIONS.push({ start: x, end: x + d - .15, html: s }); x += d; });
}

function header(c, lt) {
  if (!c.num) return "";
  const big = 1 - ramp(lt, 1.6, .6), small = ramp(lt, 1.7, .6);
  let s = G(ramp(lt, 0, .5) * big, T(960, 520, c.num, { size: 30, anchor: "middle", fill: C.yellow, weight: 600, ls: 6 }) + T(960, 610, c.title, { size: 104, anchor: "middle", font: SERIF }));
  s += G(small, T(96, 108, c.num, { size: 20, fill: C.yellow, weight: 600, ls: 4 }) + T(140, 110, c.title, { size: 42, font: SERIF }));
  return s;
}

function renderFrame(t) {
  const c = CH.find(c => t >= c.start && t < c.start + c.dur) || CH[CH.length - 1];
  const lt = t - c.start;
  const fadeIn = c.num ? ramp(lt, 1.6, .7) : 1, fadeOut = 1 - ramp(lt, c.dur - .45, .45);
  let s = "";
  s += G(fadeIn * fadeOut, c.draw(lt));
  s += G(fadeOut, header(c, lt));
  s += R(0, 0, 1920 * clamp(t / DURATION), 4, { fill: C.yellow, op: .85 });
  document.getElementById("scene").innerHTML = s;
  const cap = CAPTIONS.find(k => t >= k.start && t < k.end);
  const el = document.getElementById("cap");
  if (cap) { el.innerHTML = cap.html; el.style.opacity = Math.min(ramp(t, cap.start, .25), 1 - ramp(t, cap.end - .25, .25)).toFixed(3); }
  else el.innerHTML = "";
}
window.renderFrame = renderFrame; window.DURATION = DURATION; window.CAPTIONS = CAPTIONS;
window.CHAPTERS = CH.map(c => ({ id: c.id, start: c.start, dur: c.dur, title: c.title || "" }));
const q = new URLSearchParams(location.search); renderFrame(parseFloat(q.get("t") || "0"));
</script>
</body>
